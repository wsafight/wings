name: Check Wings

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p wings-compile -p wings-vm --bins --examples
      - run: python3 scripts/verify_scalar_aot.py
      - name: Verify optimized stackful execution
        run: |
          cargo build --release --locked -p wings-compile -p wings-vm --bins --examples
          WINGS_PROFILE=release python3 scripts/verify_scalar_aot.py
      - name: Check source and execute native AOT Counter
        shell: bash
        run: |
          cargo run --locked -p wings-compile -- check examples/counter.wings
          cargo run --locked -p wings-compile -- build examples/counter.wings -o target/counter-aot
          actual=$(cargo run --locked -p wings-vm -- run --trusted target/counter-aot < examples/counter.messages.jsonl)
          expected=$(printf '%s\n' '{"reply":0}' '{"reply":3}' '{"reply":7}' '{"accepted":true}' '{"accepted":true}' '{"reply":12}' '{"reply":null}')
          test "$actual" = "$expected"
      - name: Verify dependency isolation
        shell: bash
        run: |
          if cargo tree -p wings-lsp --locked --prefix none | grep -E '^(cranelift-|wings-(codegen|ir|vm|compile|abi|artifact) )'; then exit 1; fi
          if cargo tree -p wings-vm --locked --prefix none | grep -E '^(cranelift-|wings-(codegen|ir|compile|source|syntax|sema|lsp) )'; then exit 1; fi
          if cargo tree -p wings-vm --locked -e features | grep -E 'corosensei feature "(default|unwind|asm-unwind)"'; then exit 1; fi
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace --all-targets --locked
