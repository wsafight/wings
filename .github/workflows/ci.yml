name: Incremental Wings Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incremental-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incremental:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Select and execute incremental checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          ASTRO_SITE: https://wsafight.github.io
          ASTRO_BASE: /wings
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/verify_incremental.py --base "$PR_BASE" --no-cache
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${PUSH_BASE}^{commit}"; then
            python3 scripts/verify_incremental.py --base "$PUSH_BASE" --no-cache
          else
            python3 scripts/verify_incremental.py --all --no-cache
          fi
      - name: Preserve incremental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-validation
          path: target/incremental-validation/runs/
          if-no-files-found: ignore
