name: Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s scripts -p "*_tests.py"
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Execute every debug test harness under OS limits
        run: |
          rm -rf target/workspace-validation
          python3 scripts/verify_workspace.py --output target/workspace-validation/debug
      - run: cargo test --workspace --doc --locked
      - name: Build CLI binaries and examples
        run: cargo build --locked -p wings-compile -p wings-vm --bins --examples
      - name: Verify end-to-end native AOT runtime
        run: WINGS_PREBUILT_EXAMPLES=1 WINGS_TARGET_DIR="$PWD/target" python3 scripts/verify_scalar_aot.py
      - name: Check source and execute native AOT Counter
        shell: bash
        run: |
          rm -rf target/counter-aot
          cargo run --locked -p wings-compile -- check examples/counter.wings
          cargo run --locked -p wings-compile -- build examples/counter.wings -o target/counter-aot
          actual=$(cargo run --locked -p wings-vm -- run --trusted target/counter-aot < examples/counter.messages.jsonl)
          expected=$(printf '%s\n' '{"reply":0}' '{"reply":3}' '{"reply":7}' '{"accepted":true}' '{"accepted":true}' '{"reply":12}' '{"reply":null}')
          test "$actual" = "$expected"
      - name: Verify dependency isolation
        shell: bash
        run: |
          if cargo tree -p wings-lsp --locked --prefix none | grep -E '^(cranelift-|wings-(codegen|ir|vm|compile|abi|artifact) )'; then exit 1; fi
          if cargo tree -p wings-vm --locked --prefix none | grep -E '^(cranelift-|wings-(codegen|ir|compile|source|syntax|sema|lsp) )'; then exit 1; fi
          if cargo tree -p wings-vm --locked -e features | grep -E 'corosensei feature "(default|unwind|asm-unwind)"'; then exit 1; fi
      - name: Preserve workspace test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-tests-${{ matrix.runner }}-${{ matrix.arch }}
          path: target/workspace-validation/
          if-no-files-found: ignore
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85.0
      - run: cargo check --workspace --all-targets --locked
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - env:
          ASTRO_SITE: https://wsafight.github.io
          ASTRO_BASE: /wings
        run: npm run build
