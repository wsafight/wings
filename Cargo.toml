[workspace]
members = [
    "crates/wings-source",
    "crates/wings-syntax",
    "crates/wings-sema",
    "crates/wings-compile",
    "crates/wings-lsp",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/wsafight/wings"
readme = "README.md"
license = "Apache-2.0"
publish = ["crates-io"]

[workspace.dependencies]
wings-source = { version = "0.0.1", path = "crates/wings-source" }
wings-syntax = { version = "0.0.1", path = "crates/wings-syntax" }
wings-sema = { version = "0.0.1", path = "crates/wings-sema" }
serde_json = "1.0"
