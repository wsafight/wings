[workspace]
members = [
    "crates/wings-source",
    "crates/wings-syntax",
    "crates/wings-sema",
    "crates/wings-compile",
    "crates/wings-lsp",
    "crates/wings-abi",
    "crates/wings-ir",
    "crates/wings-artifact",
    "crates/wings-codegen",
    "crates/wings-vm",
]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/wsafight/wings"
readme = "README.md"
license = "Apache-2.0"
publish = ["crates-io"]

[workspace.dependencies]
wings-source = { version = "0.0.2", path = "crates/wings-source" }
wings-syntax = { version = "0.0.2", path = "crates/wings-syntax" }
wings-sema = { version = "0.0.2", path = "crates/wings-sema" }
wings-abi = { version = "0.0.2", path = "crates/wings-abi" }
wings-ir = { version = "0.0.2", path = "crates/wings-ir" }
wings-artifact = { version = "0.0.2", path = "crates/wings-artifact" }
wings-codegen = { version = "0.0.2", path = "crates/wings-codegen" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cranelift-codegen = "=0.118.0"
cranelift-frontend = "=0.118.0"
cranelift-module = "=0.118.0"
cranelift-object = "=0.118.0"
cranelift-native = "=0.118.0"
libloading = "0.8.9"
